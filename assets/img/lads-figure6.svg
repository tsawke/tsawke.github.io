<svg xmlns="http://www.w3.org/2000/svg" width="241pt" height="164pt" viewBox="0 0 241 164" role="img" aria-labelledby="title desc">
<title id="title">Pictorial continuation stages and measured latency profiles</title>
<desc id="desc">Four pictograms identify the stages of two profiles showing mean continuation latency on a shared zero-based 0–16 second scale. Each mean gives equal weight to three matched arrival seeds. The near-zero LADS receipt-to-allocation interval keeps its measured width and has one purple elbow annotation. Its inference interval has a direct label to the right. Individual seed markers are omitted to keep the stage comparison clear.</desc>
<style>text{font-family:Arial,sans-serif}</style>
