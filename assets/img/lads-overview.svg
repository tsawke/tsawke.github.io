<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
  <title id="title">LADS: coordinating tool-result delivery and shared inference</title>
  <desc id="desc">LADS schedules ready tool observations before transmission over a constrained return path, coordinating delivery with cache reuse so agent workflows can resume on a shared inference service. This is a conceptual diagram.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#47716b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="560" height="560" rx="16" fill="#f2f7f5"/>
  <g font-family="Inter, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="280" y="43" fill="#102a43" font-size="23" font-weight="650">From tool returns to the next decision</text>
    <g fill="#ffffff" stroke="#9bb9af" stroke-width="1.2">
      <rect x="40" y="76" width="144" height="64" rx="10"/>
      <rect x="208" y="76" width="144" height="64" rx="10"/>
      <rect x="376" y="76" width="144" height="64" rx="10"/>
    </g>
    <g fill="#102a43" font-size="17" font-weight="600">
      <text x="112" y="105">Agent A</text><text x="280" y="105">Agent B</text><text x="448" y="105">Agent C</text>
    </g>
    <g fill="#53646d" font-size="13">
      <text x="112" y="125">tool result ready</text><text x="280" y="125">tool result ready</text><text x="448" y="125">tool result ready</text>
    </g>
    <g fill="none" stroke="#47716b" stroke-width="1.5">
      <path d="M112 140V166H280V185" marker-end="url(#arrow)"/>
      <path d="M280 140V166"/>
      <path d="M448 140V166H280"/>
    </g>
    <rect x="64" y="188" width="432" height="116" rx="12" fill="#dcefeb" stroke="#086e67" stroke-width="1.5"/>
    <text x="280" y="227" fill="#086e67" font-size="32" font-weight="700">LADS</text>
    <text x="280" y="256" fill="#102a43" font-size="17" font-weight="600">Delivery scheduling + cache reuse</text>
    <text x="280" y="282" fill="#365c55" font-size="14">Coordinating when agent workflows resume</text>
    <path d="M280 304V336" fill="none" stroke="#47716b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="92" y="340" width="376" height="58" rx="10" fill="#e6eeea" stroke="#9bb9af" stroke-width="1.2"/>
    <text x="280" y="365" fill="#102a43" font-size="16" font-weight="600">Constrained return path</text>
    <text x="280" y="385" fill="#53646d" font-size="13">Scheduled observations reach the model service</text>
    <path d="M280 398V430" fill="none" stroke="#47716b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="92" y="434" width="376" height="74" rx="10" fill="#ffffff" stroke="#9bb9af" stroke-width="1.2"/>
    <text x="280" y="464" fill="#102a43" font-size="18" font-weight="600">Shared inference service</text>
    <text x="280" y="488" fill="#53646d" font-size="14">Resume reasoning and continue the workflow</text>
    <text x="280" y="538" fill="#53646d" font-size="12">Conceptual overview</text>
  </g>
</svg>
